<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:J;src:url(../assets/fonts/PlusJakartaSans-Medium.ttf);font-weight:500}
@font-face{font-family:J;src:url(../assets/fonts/PlusJakartaSans-ExtraBold.ttf);font-weight:800}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#141433}
#stage{position:absolute;inset:0;font-family:J;font-weight:800;-webkit-font-smoothing:antialiased;overflow:hidden}
.layer{position:absolute;inset:0}
.blk{position:absolute;left:calc(var(--u)*96);right:calc(var(--u)*96)}
.wm{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.14em;margin-bottom:-.14em}
.wm>span{display:inline-block}
.eye{position:absolute;border-radius:50%;display:grid;place-items:center}
.eye .well{position:absolute;inset:11%;border-radius:50%}
.eye svg{position:relative;width:68%;height:auto;overflow:visible}
.tight{letter-spacing:-.045em;line-height:1.02}
.cur{display:inline-block;width:.08em;height:.9em;margin-left:.06em;vertical-align:-.08em}
</style>
</head>
<body>
<div id="stage"></div>
<script src="eye.js"></script>
<script src="videos.js"></script>
<script src="hood.js"></script>
<script src="says.js"></script>
</body>
</html>
